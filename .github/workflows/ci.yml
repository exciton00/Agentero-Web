name: CI

# This fork is a self-hosted web build of Agentero. CI is intentionally scoped
# to the web host and its shared crates; inherited desktop-only checks
# (bindings regeneration, full UI test suite, formatting of all legacy files)
# are not part of this workflow.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typescript:
    name: TypeScript (web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build web assets
        run: pnpm build:web

  rust-web:
    name: Rust (agentero-core / agentero-web / agentero-host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Core tests
        run: cargo test -p agentero-core --lib
      - name: Web host tests
        run: cargo test -p agentero-web
      - name: Agent host tests
        run: cargo test -p agentero-host
