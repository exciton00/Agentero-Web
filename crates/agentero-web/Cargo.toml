[package]
name = "agentero-web"
version = "0.12.0"
edition = "2021"
description = "Headless web host for Agentero (axum + agentero-core)"
authors = ["you"]
license = "MIT"
publish = false

[[bin]]
name = "agentero-web"
path = "src/main.rs"

[dependencies]
# Tauri-free domain services shared with the desktop Host and the CLI.
# `schemars` enables the JsonSchema derives MCP tool outputs need.
agentero-core = { path = "../agentero-core", features = ["schemars"] }
# Tauri-free BYOA/ACP runtime shared with the desktop Host.
agentero-host = { path = "../agentero-host" }
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "query",
  "tokio",
  "ws",
] }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "net",
  "fs",
  "sync",
  "time",
  "io-util",
  "process",
] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
mime_guess = "2"
dirs = { workspace = true }
futures-util = { version = "0.3", features = ["sink"] }
notify-debouncer-full = "0.3"
# Cooperative cancellation tokens for server-side jobs.
tokio-util = { version = "0.7", default-features = false }
# Sync scope-size walk (same walker the core sync engine uses).
walkdir = "2"
# Response compression for API/SPA payloads (gzip + brotli negotiated via
# Accept-Encoding). Applied in main.rs with a media-aware predicate.
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
# HTTP-date parsing/formatting for `Last-Modified` / `If-Modified-Since`.
httpdate = "1"
# Base64 decode for the layout page-count guard (same crate the core engines use).
base64 = "0.22"
# Streamable HTTP MCP server (headless port of `src-tauri/src/integration/mcp`):
# JSON-schema tool macros + the axum transport on the dedicated MCP listener.
rmcp = { version = "3.1", default-features = false, features = [
  "server",
  "macros",
  "schemars",
  "transport-io",
  "transport-streamable-http-server",
] }
# Derive `JsonSchema` for MCP tool argument/output DTOs.
schemars = "1"

[dev-dependencies]
# In-memory MCP protocol tests (client side over a duplex pipe).
rmcp = { version = "3.1", default-features = false, features = [
  "client",
  "server",
  "macros",
  "schemars",
  "transport-io",
] }
tempfile = { workspace = true }
