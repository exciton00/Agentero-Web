# Headless Agentero Web UI — single-user, no built-in auth.
# Put a reverse proxy (Caddy/nginx/Tailscale Funnel) in front for TLS + auth.
services:
  agentero-web:
    build:
      context: .
      args:
        AGENTERO_BUILD_VERSION: ${AGENTERO_BUILD_VERSION:-dev}
    image: agentero-web:local
    container_name: agentero-web
    restart: unless-stopped
    ports:
      # Bind to loopback by default; flip to "8787:8787" only behind a proxy.
      - "127.0.0.1:8787:8787"
    environment:
      AGENTERO_WEB_ADDR: 0.0.0.0:8787
      AGENTERO_WEB_VAULT: /vault
      AGENTERO_WEB_DIST: /app/dist
      RUST_LOG: info
      # Optional: extra roots the file endpoints may read (colon separated).
      # AGENTERO_WEB_ALLOW_ROOTS: /data/imports
      # Optional: cloud-sync credentials (XDG sync.json otherwise).
      # AGENTERO_SYNC_ACCESS_KEY: ""
      # AGENTERO_SYNC_SECRET_KEY: ""
    volumes:
      - ${AGENTERO_VAULT_DIR:-./vault}:/vault
      - ${AGENTERO_DATA_DIR:-./data}:/data
    # NAS-friendly: cap logging.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
